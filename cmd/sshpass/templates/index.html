<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>win-sshpass Web</title>
  <script>
    (() => {
      const mode = localStorage.getItem("winSSHPassTheme") || "system";
      const resolved = mode === "system"
        ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
        : mode;
      document.documentElement.dataset.theme = resolved;
      document.documentElement.style.colorScheme = resolved;
    })();
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #151b23;
      --panel-soft: #1b222c;
      --panel-raised: #212a36;
      --line: #2c3542;
      --line-bright: #3b4656;
      --text: #e6edf3;
      --muted: #8b98a9;
      --accent: #2fbf8f;
      --accent-soft: #173b30;
      --blue: #62a8ff;
      --danger: #ff7b72;
      --warning: #e3b341;
      --input-bg: #0d131b;
      --terminal-bg: #090d13;
      --terminal-text: #d6e2ec;
      --hover-bg: #293443;
      --selection-bg: #24493d;
      --selection-line: #32705d;
      --card-shadow: 0 24px 80px rgba(0, 0, 0, .38);
      --drop-bg: rgba(13, 27, 23, .92);
      --radius: 8px;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f4f7f9;
      --panel: #ffffff;
      --panel-soft: #eef2f5;
      --panel-raised: #e6ebf0;
      --line: #d8e0e7;
      --line-bright: #c8d2dc;
      --text: #1f2937;
      --muted: #667085;
      --accent: #13795b;
      --accent-soft: #def4ea;
      --blue: #2563eb;
      --danger: #c62828;
      --warning: #9a6700;
      --input-bg: #ffffff;
      --terminal-bg: #fbfcfd;
      --terminal-text: #202a35;
      --hover-bg: #eaf0f4;
      --selection-bg: #d9f3e9;
      --selection-line: #1c9a72;
      --card-shadow: 0 24px 80px rgba(30, 41, 59, .16);
      --drop-bg: rgba(225, 246, 238, .95);
    }
    html[data-theme="light"] button.primary {
      border-color: #78bfa7;
      color: #0b5f45;
    }
    html[data-theme="light"] button.danger { color: #a51f1f; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input {
      font: inherit;
    }
    button {
      border: 1px solid var(--line-bright);
      border-radius: 6px;
      background: var(--panel-raised);
      color: var(--text);
      min-height: 32px;
      padding: 5px 11px;
      cursor: pointer;
    }
    button:hover { border-color: var(--line-bright); background: var(--hover-bg); }
    button:disabled { opacity: .45; cursor: default; }
    button.primary { border-color: #277c64; background: var(--accent-soft); color: #a8f0d4; }
    button.primary:hover { background: #1b493b; }
    button.danger { border-color: #64353a; color: #ffb4b0; }
    button.icon { width: 32px; min-width: 32px; padding: 4px; }
    input[type="text"], input[type="password"], input[type="number"] {
      border: 1px solid var(--line-bright);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--text);
      outline: none;
      min-width: 0;
      padding: 7px 9px;
    }
    input:focus { border-color: #438d78; box-shadow: 0 0 0 3px rgba(47, 191, 143, .11); }
    .hidden { display: none !important; }

    #boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      z-index: 20;
    }
    .boot-box { display: grid; justify-items: center; gap: 14px; color: var(--muted); }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #connectPanel {
      position: fixed;
      inset: 0;
      overflow: auto;
      padding: 5vh 16px;
      background:
        radial-gradient(circle at 15% 0%, rgba(36, 96, 82, .26), transparent 30rem),
        var(--bg);
      z-index: 10;
    }
    html[data-theme="light"] #connectPanel {
      background: radial-gradient(circle at 15% 0%, rgba(111, 205, 171, .22), transparent 30rem), var(--bg);
    }
    .connect-card {
      width: min(760px, 100%);
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }
    .connect-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }
    .connect-title h1 { margin: 0; font-size: 18px; }
    .connect-title p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .connect-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
      padding: 20px;
    }
    .field { display: grid; gap: 5px; color: var(--muted); font-size: 12px; }
    .field.wide, .check-row, .connect-actions { grid-column: 1 / -1; }
    .field input { width: 100%; }
    .check-row { display: flex; flex-wrap: wrap; gap: 20px; }
    .check-row label { display: flex; align-items: center; gap: 7px; color: var(--text); }
    .check-row input { accent-color: var(--accent); }
    .connect-actions { display: flex; align-items: center; gap: 10px; }
    .connect-actions span { color: var(--danger); font-size: 12px; }

    #workspace {
      display: none;
      width: 100vw;
      height: 100vh;
      --file-pane-width: 34vw;
      grid-template-columns: var(--file-pane-width) 5px minmax(0, 1fr);
      background: var(--line);
      gap: 0;
    }
    #workspace.visible { display: grid; }
    body.resizing-panes { cursor: col-resize; user-select: none; }
    .pane {
      min-width: 0;
      min-height: 0;
      background: var(--panel);
      display: flex;
      flex-direction: column;
    }
    .splitter {
      position: relative;
      z-index: 4;
      width: 5px;
      cursor: col-resize;
      background: var(--line);
      touch-action: none;
      outline: none;
    }
    .splitter::after {
      content: "";
      position: absolute;
      inset: 0 1px;
      background: transparent;
      transition: background .12s ease;
    }
    .splitter:hover::after,
    .splitter:focus-visible::after,
    .splitter.active::after { background: var(--accent); }
    .splitter:focus-visible { box-shadow: 0 0 0 2px rgba(47,191,143,.28); }
    .files-pane { position: relative; }
    .pane-head {
      flex: 0 0 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }
    .pane-title { display: flex; align-items: center; gap: 9px; min-width: 0; font-weight: 600; }
    .pane-title strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pane-tools { display: flex; align-items: center; gap: 6px; }
    .theme-select {
      min-height: 32px;
      border: 1px solid var(--line-bright);
      border-radius: 6px;
      background: var(--panel-raised);
      color: var(--text);
      padding: 4px 7px;
      outline: none;
    }
    .theme-select:focus { border-color: var(--accent); }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px rgba(47,191,143,.7); }
    .ssh-label { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
    .terminal-dot { color: var(--accent); }

    .pathbar {
      flex: 0 0 46px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border-bottom: 1px solid var(--line);
      background: var(--input-bg);
    }
    .pathbar input { width: 100%; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
    .file-columns {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 88px 112px;
      gap: 8px;
      padding: 0 12px 7px 38px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
      border-bottom: 1px solid var(--line);
    }
    #fileList {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 5px 6px 12px;
    }
    .file-row {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) 88px 112px;
      align-items: center;
      gap: 4px;
      min-height: 32px;
      padding: 0 6px 0 4px;
      border-radius: 5px;
      cursor: default;
      user-select: none;
    }
    .file-row[draggable="true"] { cursor: grab; }
    .file-row.dragging { opacity: .45; }
    .file-row:hover { background: var(--hover-bg); }
    .file-row.selected { background: var(--selection-bg); box-shadow: inset 0 0 0 1px var(--selection-line); }
    .file-icon { text-align: center; color: var(--blue); font-size: 15px; }
    .file-icon.dir { color: #e3b341; }
    .file-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-size, .file-time { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-empty { padding: 32px 16px; text-align: center; color: var(--muted); }
    .file-footer {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-top: 1px solid var(--line);
      background: var(--panel-soft);
    }
    .file-footer .spacer { flex: 1; }
    .drop-overlay {
      display: none;
      position: absolute;
      inset: 50px 8px 48px;
      z-index: 5;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      border: 2px dashed var(--accent);
      border-radius: 10px;
      background: var(--drop-bg);
      color: #bdf7df;
      text-align: center;
      pointer-events: none;
    }
    .drop-overlay strong { font-size: 16px; }
    .drop-overlay span { color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .files-pane.dragging .drop-overlay { display: flex; }
    .upload-progress {
      flex: 0 0 auto;
      padding: 8px 10px 9px;
      border-top: 1px solid var(--line);
      background: var(--panel-soft);
    }
    .upload-progress-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
    }
    .upload-progress-head strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-weight: 500;
    }
    .upload-percent { color: var(--accent); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .upload-progress-track {
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--line);
    }
    .upload-progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #248f70, var(--accent));
      transition: width .12s linear;
    }
    .upload-progress.error .upload-percent { color: var(--danger); }
    .upload-progress.error .upload-progress-bar { background: var(--danger); }

    .terminal-head-meta { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
    .terminal-host {
      flex: 1 1 auto;
      min-height: 0;
      padding: 10px;
      background: var(--terminal-bg);
    }
    .terminal-host .xterm { height: 100%; }
    .terminal-host .xterm-viewport { overflow-y: auto !important; }
    .terminal-footer {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 43px;
      padding: 5px 12px;
      border-top: 1px solid var(--line);
      background: var(--panel-soft);
    }
    #sessionMessage { flex: 1; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #sessionMessage.error { color: var(--danger); }

    @media (max-width: 820px) {
      body { overflow: auto; }
      #workspace { grid-template-columns: 1fr; grid-template-rows: 44vh 56vh; height: 100vh; }
      .splitter { display: none; }
      .file-columns { grid-template-columns: minmax(0, 1fr) 70px; }
      .file-time { display: none; }
      .file-row { grid-template-columns: 22px minmax(0, 1fr) 70px; }
      .connect-grid { grid-template-columns: 1fr; }
      .field { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div id="boot" class="boot-box">
    <div class="spinner"></div>
    <div>Connecting to SSH server…</div>
  </div>

  <section id="connectPanel" class="hidden">
    <div class="connect-card">
      <div class="connect-title">
        <div>
          <h1>Connect to a server</h1>
          <p>Credentials stay in the local win-sshpass process · {{.Address}}</p>
        </div>
        <span class="status-chip"><span class="status-dot" style="background:var(--muted);box-shadow:none"></span>Disconnected</span>
      </div>
      <form id="connectForm" class="connect-grid" autocomplete="off">
        <label class="field">Host<input name="host" value="127.0.0.1" required></label>
        <label class="field">Username<input name="user" value="root" required></label>
        <label class="field">Port<input name="port" value="22" inputmode="numeric" required></label>
        <label class="field">Password<input name="password" type="password" placeholder="Empty password is allowed"></label>
        <label class="field wide">Private key path<input name="keyPath" placeholder="~/.ssh/id_ed25519"></label>
        <label class="field wide">Proxy URL<input name="proxyURL" placeholder="socks5://127.0.0.1:1080"></label>
        <label class="field">Operation timeout<input name="timeout" type="number" min="0" value="120"></label>
        <label class="field">Connect timeout<input name="connectTimeout" type="number" min="0" value="10"></label>
        <label class="field">Connection attempts<input name="retries" type="number" min="0" value="3"></label>
        <div class="check-row">
          <label><input name="useAgent" type="checkbox">Use ssh-agent</label>
          <label><input name="strictHostKey" type="checkbox">Verify known_hosts</label>
        </div>
        <div class="connect-actions">
          <button class="primary" type="submit">Connect</button>
          <span id="connectMessage"></span>
        </div>
      </form>
    </div>
  </section>

  <main id="workspace" aria-label="SSH manager">
    <section class="pane files-pane">
      <div class="pane-head">
        <div class="pane-title"><span style="color:var(--warning)">▰</span><strong>SFTP Files</strong></div>
        <div class="pane-tools">
          <select id="themeSelect" class="theme-select" aria-label="Theme">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
          <button id="refreshFiles" class="icon" type="button" title="Refresh">↻</button>
          <button id="upDirectory" class="icon" type="button" title="Parent directory">↑</button>
        </div>
      </div>
      <form id="pathForm" class="pathbar">
        <button class="icon" type="submit" title="Go to path">↵</button>
        <input id="pathInput" type="text" spellcheck="false" aria-label="Remote path">
        <button id="mkdirButton" type="button" title="Create directory">+ Dir</button>
      </form>
      <div class="file-columns"><span>Name</span><span>Size</span><span>Modified</span></div>
      <div id="fileList" role="listbox" aria-label="Remote files"></div>
      <div id="dropOverlay" class="drop-overlay">
        <strong>Drop files or folders to upload</strong>
        <span id="dropTarget"></span>
      </div>
      <div id="uploadProgress" class="upload-progress hidden" aria-live="polite">
        <div class="upload-progress-head">
          <strong id="uploadName">Preparing upload…</strong>
          <span id="uploadPercent" class="upload-percent">0%</span>
        </div>
        <div class="upload-progress-track"><div id="uploadBar" class="upload-progress-bar"></div></div>
      </div>
      <div class="file-footer">
        <button id="uploadButton" class="primary" type="button">Upload</button>
        <button id="downloadButton" type="button" disabled>Download</button>
        <span class="spacer"></span>
        <button id="deleteButton" class="danger" type="button" disabled>Delete</button>
        <input id="filePicker" class="hidden" type="file" multiple>
      </div>
    </section>

    <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize file manager" aria-valuemin="260" tabindex="0"></div>

    <section class="pane terminal-pane">
      <div class="pane-head">
        <div class="pane-title">
          <span class="terminal-dot">●</span>
          <strong>SSH Console</strong>
        </div>
        <div class="terminal-head-meta">
          <span class="ssh-label" id="sessionLabel"></span>
          <span class="status-chip"><span id="connectionDot" class="status-dot"></span><span id="connectionStatus">Connecting</span></span>
        </div>
      </div>
      <div id="terminalHost" class="terminal-host"></div>
      <div class="terminal-footer">
        <button id="clearButton" type="button">Clear terminal</button>
        <button id="reconnectButton" type="button">Reconnect terminal</button>
        <span id="sessionMessage"></span>
      </div>
    </section>
  </main>

  <link rel="stylesheet" href="/assets/xterm.css">
  <script src="/assets/xterm.min.js"></script>
  <script src="/assets/addon-fit.min.js"></script>
  <script>
    (() => {
      const boot = document.getElementById("boot");
      const connectPanel = document.getElementById("connectPanel");
      const connectForm = document.getElementById("connectForm");
      const connectMessage = document.getElementById("connectMessage");
      const workspace = document.getElementById("workspace");
      const splitter = document.getElementById("splitter");
      const themeSelect = document.getElementById("themeSelect");
      const filesPane = document.querySelector(".files-pane");
      const pathForm = document.getElementById("pathForm");
      const pathInput = document.getElementById("pathInput");
      const fileList = document.getElementById("fileList");
      const dropTarget = document.getElementById("dropTarget");
      const uploadProgress = document.getElementById("uploadProgress");
      const uploadName = document.getElementById("uploadName");
      const uploadPercent = document.getElementById("uploadPercent");
      const uploadBar = document.getElementById("uploadBar");
      const filePicker = document.getElementById("filePicker");
      const uploadButton = document.getElementById("uploadButton");
      const downloadButton = document.getElementById("downloadButton");
      const deleteButton = document.getElementById("deleteButton");
      const terminalHost = document.getElementById("terminalHost");
      const connectionStatus = document.getElementById("connectionStatus");
      const connectionDot = document.getElementById("connectionDot");
      const sessionMessage = document.getElementById("sessionMessage");
      let terminal = null;
      let fitAddon = null;
      let terminalSocket = null;
      let terminalObserver = null;
      let terminalDecoder = new TextDecoder();
      let currentPath = "";
      let currentEntries = [];
      let selectedEntry = null;
      let paneDrag = null;
      let uploadInProgress = false;
      let uploadHideTimer = null;
      const systemTheme = matchMedia("(prefers-color-scheme: light)");

      function resolvedTheme(mode) {
        if (mode === "system") return systemTheme.matches ? "light" : "dark";
        return mode === "light" ? "light" : "dark";
      }

      function terminalTheme() {
        const theme = resolvedTheme(themeSelect.value);
        if (theme === "light") {
          return {
            background: "#fbfcfd",
            foreground: "#202a35",
            cursor: "#13795b",
            selectionBackground: "#c7ecdf",
            black: "#1f2937",
            red: "#b42318",
            green: "#13795b",
            yellow: "#8a6100",
            blue: "#1d4ed8",
            magenta: "#7e22ce",
            cyan: "#0e7490",
            white: "#475467",
            brightBlack: "#667085",
            brightRed: "#d92d20",
            brightGreen: "#0f9f75",
            brightYellow: "#b77900",
            brightBlue: "#2563eb",
            brightMagenta: "#9333ea",
            brightCyan: "#0891b2",
            brightWhite: "#111827",
          };
        }
        return {
          background: "#090d13",
          foreground: "#d6e2ec",
          cursor: "#2fbf8f",
          selectionBackground: "#264e42",
          black: "#1b222c",
          red: "#ff7b72",
          green: "#2fbf8f",
          yellow: "#e3b341",
          blue: "#62a8ff",
          magenta: "#bc8cff",
          cyan: "#39c5cf",
          white: "#e6edf3",
          brightBlack: "#8b98a9",
          brightRed: "#ff9a92",
          brightGreen: "#63e6b5",
          brightYellow: "#f2cc60",
          brightBlue: "#8cc8ff",
          brightMagenta: "#d2a8ff",
          brightCyan: "#76dbe2",
          brightWhite: "#ffffff",
        };
      }

      function applyThemeMode(mode, persist = true) {
        const normalized = mode === "light" || mode === "dark" ? mode : "system";
        const resolved = resolvedTheme(normalized);
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
        themeSelect.value = normalized;
        if (persist) localStorage.setItem("winSSHPassTheme", normalized);
        if (terminal) terminal.options.theme = terminalTheme();
      }

      themeSelect.addEventListener("change", () => applyThemeMode(themeSelect.value));
      systemTheme.addEventListener("change", () => {
        if (themeSelect.value === "system") applyThemeMode("system", false);
      });
      applyThemeMode(localStorage.getItem("winSSHPassTheme") || "system", false);

      function clampPaneWidth(width) {
        return Math.max(260, Math.min(width, window.innerWidth - 360));
      }

      function setPaneWidth(width, persist = true) {
        if (window.innerWidth <= 820) return;
        const clamped = clampPaneWidth(width);
        workspace.style.setProperty("--file-pane-width", `${clamped}px`);
        splitter.setAttribute("aria-valuenow", String(Math.round(clamped)));
        if (persist) localStorage.setItem("winSSHPassFilePaneWidth", String(Math.round(clamped)));
      }

      function restorePaneWidth() {
        const saved = Number(localStorage.getItem("winSSHPassFilePaneWidth") || 0);
        setPaneWidth(saved > 0 ? saved : window.innerWidth * 0.34, false);
      }

      splitter.addEventListener("pointerdown", (event) => {
        if (window.innerWidth <= 820) return;
        event.preventDefault();
        paneDrag = { pointerId: event.pointerId };
        splitter.setPointerCapture(event.pointerId);
        splitter.classList.add("active");
        document.body.classList.add("resizing-panes");
      });
      splitter.addEventListener("pointermove", (event) => {
        if (!paneDrag || paneDrag.pointerId !== event.pointerId) return;
        setPaneWidth(event.clientX);
      });
      function finishPaneDrag(event) {
        if (!paneDrag || paneDrag.pointerId !== event.pointerId) return;
        paneDrag = null;
        splitter.classList.remove("active");
        document.body.classList.remove("resizing-panes");
        try { splitter.releasePointerCapture(event.pointerId); } catch (_) {}
        if (terminal) fitTerminal();
      }
      splitter.addEventListener("pointerup", finishPaneDrag);
      splitter.addEventListener("pointercancel", finishPaneDrag);
      splitter.addEventListener("keydown", (event) => {
        const current = splitter.getBoundingClientRect().left;
        if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          event.preventDefault();
          setPaneWidth(current + (event.key === "ArrowLeft" ? -20 : 20));
          fitTerminal();
        }
      });
      window.addEventListener("resize", () => {
        const current = splitter.getBoundingClientRect().left;
        if (window.innerWidth > 820) setPaneWidth(current, false);
        fitTerminal();
      });
      restorePaneWidth();

      async function jsonRequest(route, body) {
        const options = { method: body === undefined ? "GET" : "POST" };
        if (body !== undefined) {
          options.headers = { "Content-Type": "application/json" };
          options.body = JSON.stringify(body);
        }
        const response = await fetch(route, options);
        let data = {};
        try { data = await response.json(); } catch (_) {}
        if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
        return data;
      }

      function setConnectionState(connected, text) {
        connectionStatus.textContent = text;
        connectionDot.style.background = connected ? "var(--accent)" : "var(--muted)";
        connectionDot.style.boxShadow = connected ? "0 0 10px rgba(47,191,143,.7)" : "none";
      }

      function setSessionMessage(message, error = false) {
        sessionMessage.textContent = message;
        sessionMessage.classList.toggle("error", error);
      }

      function showWorkspace(data) {
        boot.classList.add("hidden");
        connectPanel.classList.add("hidden");
        workspace.classList.add("visible");
        document.getElementById("sessionLabel").textContent = `${data.user}@${data.host}`;
        loadFiles("");
        startTerminal(data);
      }

      function showConnect(error = "") {
        boot.classList.add("hidden");
        workspace.classList.remove("visible");
        connectPanel.classList.remove("hidden");
        connectMessage.textContent = error;
      }

      function formatSize(bytes) {
        if (!bytes) return "—";
        const units = ["B", "KB", "MB", "GB", "TB"];
        let value = bytes;
        let unit = 0;
        while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
        return `${value >= 10 || unit === 0 ? value.toFixed(0) : value.toFixed(1)} ${units[unit]}`;
      }

      function formatTime(seconds) {
        if (!seconds) return "—";
        return new Date(seconds * 1000).toLocaleString([], {
          year: "2-digit", month: "2-digit", day: "2-digit",
          hour: "2-digit", minute: "2-digit"
        });
      }

      function clearSelection() {
        selectedEntry = null;
        for (const row of fileList.querySelectorAll(".file-row.selected")) row.classList.remove("selected");
        downloadButton.disabled = true;
        deleteButton.disabled = true;
      }

      function selectEntry(entry, row) {
        clearSelection();
        selectedEntry = entry;
        row.classList.add("selected");
        downloadButton.disabled = entry.is_dir;
        deleteButton.disabled = false;
      }

      function renderFiles(data) {
        currentPath = data.path;
        currentEntries = data.entries || [];
        pathInput.value = currentPath;
        clearSelection();
        fileList.replaceChildren();
        if (!currentEntries.length) {
          const empty = document.createElement("div");
          empty.className = "file-empty";
          empty.textContent = "This directory is empty.";
          fileList.append(empty);
          return;
        }
        for (const entry of currentEntries) {
          const row = document.createElement("div");
          row.className = "file-row";
          row.setAttribute("role", "option");
          row.tabIndex = 0;
          row.title = entry.path;
          row.draggable = !entry.is_dir;

          const icon = document.createElement("span");
          icon.className = "file-icon" + (entry.is_dir ? " dir" : "");
          icon.textContent = entry.is_dir ? "▰" : "▤";

          const name = document.createElement("span");
          name.className = "file-name";
          name.textContent = entry.name;

          const size = document.createElement("span");
          size.className = "file-size";
          size.textContent = entry.is_dir ? "—" : formatSize(entry.size);

          const time = document.createElement("span");
          time.className = "file-time";
          time.textContent = formatTime(entry.mod_time);

          row.append(icon, name, size, time);
          row.addEventListener("click", () => selectEntry(entry, row));
          row.addEventListener("dblclick", () => {
            if (entry.is_dir) loadFiles(entry.path);
            else downloadEntry(entry);
          });
          row.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              if (entry.is_dir) loadFiles(entry.path);
              else downloadEntry(entry);
            }
          });
          if (!entry.is_dir) {
            row.addEventListener("dragstart", (event) => {
              const remoteURL = new URL(`/api/download?path=${encodeURIComponent(entry.path)}`, location.href).href;
              event.dataTransfer.effectAllowed = "copy";
              event.dataTransfer.setData("DownloadURL", `application/octet-stream:${entry.name}:${remoteURL}`);
              event.dataTransfer.setData("text/uri-list", remoteURL);
              row.classList.add("dragging");
            });
            row.addEventListener("dragend", () => row.classList.remove("dragging"));
          }
          fileList.append(row);
        }
      }

      async function loadFiles(target) {
        setSessionMessage("Loading files…");
        try {
          const route = target ? `/api/files?path=${encodeURIComponent(target)}` : "/api/files";
          const data = await jsonRequest(route);
          renderFiles(data);
          setSessionMessage("");
        } catch (error) {
          setSessionMessage(error.message, true);
        }
      }

      function downloadEntry(entry) {
        if (!entry || entry.is_dir) return;
        window.location.href = `/api/download?path=${encodeURIComponent(entry.path)}`;
      }

      function normalizeRelativePath(value) {
        return String(value || "")
          .replaceAll("\\", "/")
          .split("/")
          .filter((part) => part && part !== "." && part !== "..")
          .join("/");
      }

      async function walkDroppedEntry(entry, prefix = "") {
        if (!entry) return [];
        if (entry.isFile) {
          const file = await new Promise((resolve, reject) => entry.file(resolve, reject));
          return [{ file, relativePath: prefix + file.name }];
        }
        if (!entry.isDirectory) return [];
        const reader = entry.createReader();
        let children = [];
        while (true) {
          const batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
          if (!batch.length) break;
          children.push(...batch);
        }
        const nested = [];
        for (const child of children) {
          nested.push(...await walkDroppedEntry(child, `${prefix}${entry.name}/`));
        }
        return nested;
      }

      async function droppedItems(dataTransfer) {
        const entries = [...(dataTransfer.items || [])]
          .map((item) => item.webkitGetAsEntry ? item.webkitGetAsEntry() : null)
          .filter(Boolean);
        if (entries.length) {
          const items = [];
          for (const entry of entries) items.push(...await walkDroppedEntry(entry));
          return items;
        }
        return [...(dataTransfer.files || [])].map((file) => ({ file, relativePath: file.name }));
      }

      async function uploadItems(items) {
        if (!items.length) return;
        if (uploadInProgress) return;
        const prepared = [];
        for (const item of items) {
          const relativePath = normalizeRelativePath(item.relativePath || item.file.name);
          const parts = relativePath.split("/").filter(Boolean);
          if (!parts.length) continue;
          const filename = parts.pop();
          prepared.push({ item, relativePath, directories: parts, filename, weight: Math.max(1, item.file.size) });
        }
        if (!prepared.length) return;
        uploadInProgress = true;
        uploadButton.disabled = true;
        filePicker.disabled = true;
        clearTimeout(uploadHideTimer);
        uploadProgress.classList.remove("hidden", "error");
        const totalWeight = prepared.reduce((sum, entry) => sum + entry.weight, 0);
        let completedWeight = 0;
        uploadName.textContent = `Preparing 1/${prepared.length} files…`;
        uploadPercent.textContent = "0%";
        uploadBar.style.width = "0%";

        try {
          for (let index = 0; index < prepared.length; index++) {
            const entry = prepared[index];
            const { item, relativePath, directories, filename, weight } = entry;
          let remoteDir = currentPath;
          for (const directory of directories) {
            remoteDir = remoteDir.endsWith("/") ? remoteDir + directory : `${remoteDir}/${directory}`;
            await jsonRequest("/api/mkdir", { path: remoteDir });
          }
            uploadName.textContent = `${index + 1}/${prepared.length} · ${relativePath}`;
            await uploadOneFile(item.file, remoteDir, filename, (loaded, total) => {
              const fileFraction = total > 0 ? Math.min(1, loaded / total) : 1;
              const overall = Math.min(1, (completedWeight + weight * fileFraction) / totalWeight);
              const percent = Math.floor(overall * 100);
              uploadPercent.textContent = `${percent}%`;
              uploadBar.style.width = `${percent}%`;
            });
            completedWeight += weight;
            const percent = Math.min(100, Math.floor((completedWeight / totalWeight) * 100));
            uploadPercent.textContent = `${percent}%`;
            uploadBar.style.width = `${percent}%`;
          }
          uploadPercent.textContent = "100%";
          uploadBar.style.width = "100%";
          uploadName.textContent = `Uploaded ${prepared.length} file${prepared.length === 1 ? "" : "s"}`;
          setSessionMessage("Upload complete");
          loadFiles(currentPath);
          uploadHideTimer = setTimeout(() => uploadProgress.classList.add("hidden"), 1600);
        } catch (error) {
          uploadProgress.classList.add("error");
          uploadName.textContent = "Upload failed";
          setSessionMessage(error.message, true);
        } finally {
          uploadInProgress = false;
          uploadButton.disabled = false;
          filePicker.disabled = false;
        }
      }

      function uploadOneFile(file, remoteDir, filename, onProgress) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          const form = new FormData();
          form.append("path", remoteDir);
          form.append("file", file, filename);
          xhr.open("POST", "/api/upload");
          xhr.upload.addEventListener("progress", (event) => {
            if (event.lengthComputable) onProgress(event.loaded, event.total);
          });
          xhr.addEventListener("load", () => {
            let data = {};
            try { data = JSON.parse(xhr.responseText || "{}"); } catch (_) {}
            if (xhr.status >= 200 && xhr.status < 300) {
              onProgress(file.size, file.size);
              resolve(data);
            } else {
              reject(new Error(data.error || `HTTP ${xhr.status}`));
            }
          });
          xhr.addEventListener("error", () => reject(new Error("Upload connection failed")));
          xhr.addEventListener("abort", () => reject(new Error("Upload cancelled")));
          xhr.send(form);
        });
      }

      let fileDragDepth = 0;
      filesPane.addEventListener("dragenter", (event) => {
        if (![...(event.dataTransfer.types || [])].includes("Files")) return;
        event.preventDefault();
        fileDragDepth++;
        dropTarget.textContent = currentPath;
        filesPane.classList.add("dragging");
      });
      filesPane.addEventListener("dragover", (event) => {
        if (![...(event.dataTransfer.types || [])].includes("Files")) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "copy";
      });
      filesPane.addEventListener("dragleave", (event) => {
        if (fileDragDepth === 0) return;
        fileDragDepth = Math.max(0, fileDragDepth - 1);
        if (fileDragDepth === 0) filesPane.classList.remove("dragging");
      });
      filesPane.addEventListener("drop", async (event) => {
        if (![...(event.dataTransfer.types || [])].includes("Files")) return;
        event.preventDefault();
        fileDragDepth = 0;
        filesPane.classList.remove("dragging");
        try {
          await uploadItems(await droppedItems(event.dataTransfer));
        } catch (error) {
          setSessionMessage(error.message, true);
        }
      });

      async function createDirectory() {
        const name = window.prompt("New directory name:");
        if (!name) return;
        const target = currentPath.endsWith("/") ? currentPath + name : `${currentPath}/${name}`;
        try {
          await jsonRequest("/api/mkdir", { path: target });
          setSessionMessage("Directory created");
          loadFiles(currentPath);
        } catch (error) {
          setSessionMessage(error.message, true);
        }
      }

      async function deleteSelected() {
        if (!selectedEntry) return;
        if (!window.confirm(`Delete ${selectedEntry.name}?`)) return;
        try {
          await jsonRequest("/api/delete", { path: selectedEntry.path });
          setSessionMessage("Deleted");
          loadFiles(currentPath);
        } catch (error) {
          setSessionMessage(error.message, true);
        }
      }

      async function refreshStatus() {
        try {
          const data = await jsonRequest("/api/status");
          if (data.connected) showWorkspace(data);
          else showConnect(data.error || "");
        } catch (error) {
          showConnect(error.message);
        }
      }

      function sendTerminal(message) {
        if (terminalSocket && terminalSocket.readyState === WebSocket.OPEN) {
          terminalSocket.send(JSON.stringify(message));
        }
      }

      function fitTerminal() {
        if (!terminal || !fitAddon) return;
        try {
          fitAddon.fit();
          sendTerminal({ type: "resize", cols: terminal.cols, rows: terminal.rows });
        } catch (_) {}
      }

      function stopTerminal(writeMessage = true) {
        if (terminalObserver) {
          terminalObserver.disconnect();
          terminalObserver = null;
        }
        if (terminalSocket) {
          terminalSocket.onclose = null;
          terminalSocket.close();
          terminalSocket = null;
        }
        if (terminal && writeMessage) {
          terminal.write("\r\n[terminal disconnected]\r\n");
        }
      }

      function startTerminal(data) {
        stopTerminal(false);
        if (terminal) terminal.dispose();
        terminalHost.replaceChildren();
        terminalDecoder = new TextDecoder();
        terminal = new Terminal({
          cursorBlink: true,
          convertEol: false,
          fontFamily: '"Cascadia Mono", "SFMono-Regular", Consolas, monospace',
          fontSize: 13,
          lineHeight: 1.2,
          scrollback: 10000,
          theme: terminalTheme()
        });
        fitAddon = new FitAddon.FitAddon();
        terminal.loadAddon(fitAddon);
        terminal.open(terminalHost);
        terminal.write(`Connected to ${data.user}@${data.host}\r\n`);
        setConnectionState(false, "Connecting");
        setSessionMessage("");

        const scheme = location.protocol === "https:" ? "wss:" : "ws:";
        terminalSocket = new WebSocket(`${scheme}//${location.host}/api/terminal`);
        terminalSocket.binaryType = "arraybuffer";
        terminalSocket.addEventListener("open", () => {
          setConnectionState(true, "Connected");
          fitTerminal();
          terminal.focus();
        });
        terminalSocket.addEventListener("message", (event) => {
          if (typeof event.data === "string") {
            terminal.write(event.data);
          } else {
            terminal.write(terminalDecoder.decode(new Uint8Array(event.data), { stream: true }));
          }
        });
        terminalSocket.addEventListener("error", () => {
          setConnectionState(false, "Connection error");
          setSessionMessage("Terminal WebSocket connection failed", true);
        });
        terminalSocket.addEventListener("close", () => {
          setConnectionState(false, "Disconnected");
        });
        terminal.onData((input) => sendTerminal({ type: "input", data: input }));
        terminal.onResize(({ cols, rows }) => sendTerminal({ type: "resize", cols, rows }));
        terminalObserver = new ResizeObserver(() => fitTerminal());
        terminalObserver.observe(terminalHost);
        requestAnimationFrame(fitTerminal);
      }

      connectForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = connectForm.querySelector('button[type="submit"]');
        button.disabled = true;
        connectMessage.textContent = "Connecting…";
        const form = new FormData(connectForm);
        const payload = {
          host: form.get("host"),
          user: form.get("user"),
          port: form.get("port"),
          password: form.get("password"),
          keyPath: form.get("keyPath"),
          proxyURL: form.get("proxyURL"),
          timeout: Number(form.get("timeout") || 0),
          connectTimeout: Number(form.get("connectTimeout") || 0),
          retries: Number(form.get("retries") || 0),
          useAgent: form.get("useAgent") === "on",
          strictHostKey: form.get("strictHostKey") === "on",
        };
        try {
          const data = await jsonRequest("/api/connect", payload);
          connectForm.querySelector('[name="password"]').value = "";
          showWorkspace(data);
        } catch (error) {
          connectMessage.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });

      pathForm.addEventListener("submit", (event) => {
        event.preventDefault();
        loadFiles(pathInput.value.trim() || "/");
      });
      document.getElementById("refreshFiles").addEventListener("click", () => loadFiles(currentPath));
      document.getElementById("upDirectory").addEventListener("click", () => {
        const parts = currentPath.replace(/\/+$/, "").split("/").filter(Boolean);
        parts.pop();
        loadFiles("/" + parts.join("/"));
      });
      uploadButton.addEventListener("click", () => filePicker.click());
      filePicker.addEventListener("change", () => {
        const items = [...filePicker.files].map((file) => ({ file, relativePath: file.name }));
        filePicker.value = "";
        uploadItems(items);
      });
      document.getElementById("mkdirButton").addEventListener("click", createDirectory);
      downloadButton.addEventListener("click", () => downloadEntry(selectedEntry));
      deleteButton.addEventListener("click", deleteSelected);

      document.getElementById("clearButton").addEventListener("click", () => {
        if (terminal) terminal.clear();
        if (terminal) terminal.focus();
      });
      document.getElementById("reconnectButton").addEventListener("click", () => {
        const label = document.getElementById("sessionLabel").textContent.split("@");
        startTerminal({ user: label[0], host: label.slice(1).join("@") });
      });

      refreshStatus();
    })();
  </script>
</body>
</html>
